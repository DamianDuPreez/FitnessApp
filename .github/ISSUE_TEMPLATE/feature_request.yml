name: Feature request
description: Idea for something new
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to be able to do?
      description: Describe it from the gym-goer's point of view.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Workout logging
        - PRs & records
        - Milestones & achievements
        - Progress & stats
        - Body measurements
        - Exercise library
        - PWA / offline / install
        - Other
  - type: textarea
    id: notes
    attributes:
      label: Notes / references
      description: Screenshots of how other apps do it, links, etc.
