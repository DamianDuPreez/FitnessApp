name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.app.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for app code
        id: app
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet - nothing to deploy."; fi

      - uses: actions/setup-node@v4
        if: steps.app.outputs.exists == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.app.outputs.exists == 'true'

      - name: Build
        if: steps.app.outputs.exists == 'true'
        run: npm run build
        env:
          # Site is served from https://<user>.github.io/FitnessApp/
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        if: steps.app.outputs.exists == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.app.outputs.exists == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
